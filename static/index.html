<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firecrawl 網頁爬蟲</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #475569;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      text-align: center;
      padding: 32px 0;
    }

    header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-row.wrap { flex-wrap: wrap; }

    .form-group {
      flex: 1;
      min-width: 200px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover { background: #dc2626; }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover { background: #059669; }

    .btn-warning {
      background: var(--warning);
      color: #111;
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-starting { background: #3b82f620; color: #60a5fa; }
    .status-crawling, .status-scraping { background: #f59e0b20; color: #fbbf24; }
    .status-completed { background: #10b98120; color: #34d399; }
    .status-failed { background: #ef444420; color: #f87171; }
    .status-cancelled { background: #6b728020; color: #9ca3af; }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #a78bfa);
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .job-list {
      display: grid;
      gap: 12px;
    }

    .job-item {
      background: var(--bg-input);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .job-item:hover { border-color: var(--primary); }
    .job-item.active { border-color: var(--primary); background: #4338ca15; }

    .job-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .job-item-url {
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 500;
      word-break: break-all;
    }

    .job-item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .page-item {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.2s;
    }

    .page-item:hover { background: rgba(255,255,255,0.03); }

    .page-item-title {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .page-item-url {
      font-size: 0.82rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .detail-panel {
      position: fixed;
      top: 0; right: 0;
      width: 50%;
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .detail-panel.open { transform: translateX(0); }

    .detail-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .detail-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .detail-content pre {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 70vh;
      overflow-y: auto;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      display: none;
    }

    .overlay.open { display: block; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--primary);
      color: white;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .api-key-section {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .api-key-section .form-group { flex: 1; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      z-index: 200;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .detail-panel { width: 90%; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Firecrawl 網頁爬蟲工具</h1>
      <p>使用 Firecrawl API 爬取網站內容，支援斷點續傳</p>
    </header>

    <!-- API Key Config -->
    <div class="card" id="configCard">
      <h2>API 設定</h2>
      <div class="api-key-section">
        <div class="form-group">
          <label>Firecrawl API Key</label>
          <input type="password" id="apiKeyInput" placeholder="fc-xxxxxxxx...">
        </div>
        <button class="btn btn-primary" onclick="saveApiKey()">儲存</button>
      </div>
      <div id="apiKeyStatus" style="margin-top:8px; font-size:0.85rem; color:var(--text-muted)"></div>
    </div>

    <!-- New Crawl -->
    <div class="card">
      <h2>開始爬取</h2>
      <div class="form-row">
        <div class="form-group" style="flex:3">
          <label>目標網址</label>
          <input type="url" id="crawlUrl" placeholder="https://trueway.adholic.com.tw/" value="https://trueway.adholic.com.tw/">
        </div>
        <div class="form-group" style="flex:1; min-width:120px">
          <label>最大頁數</label>
          <input type="number" id="crawlLimit" value="100" min="1" max="10000">
        </div>
      </div>
      <button class="btn btn-primary" id="startCrawlBtn" onclick="startCrawl()">開始爬取</button>
    </div>

    <!-- Job List -->
    <div class="card">
      <h2>爬取任務列表</h2>
      <div id="jobList" class="job-list">
        <div class="empty-state">尚無任務</div>
      </div>
    </div>

    <!-- Active Job Detail -->
    <div class="card" id="jobDetail" style="display:none">
      <h2>任務詳情 - <span id="detailJobId"></span></h2>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px">
        <div><strong>網址：</strong><span id="detailUrl"></span></div>
        <div><strong>狀態：</strong><span id="detailStatus"></span></div>
        <div><strong>進度：</strong><span id="detailProgress"></span></div>
        <div><strong>已爬頁數：</strong><span id="detailPageCount"></span></div>
      </div>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="detailProgressBar" style="width:0%"></div>
      </div>
      <div id="detailError" style="color:var(--danger); margin-top:8px; display:none"></div>
      <div class="actions">
        <button class="btn btn-success btn-sm" id="resumeBtn" onclick="resumeJob()" style="display:none">斷點續傳</button>
        <button class="btn btn-danger btn-sm" id="cancelBtn" onclick="cancelJob()" style="display:none">取消任務</button>
        <button class="btn btn-outline btn-sm" id="exportBtn" onclick="exportJob()">匯出 JSON</button>
      </div>
      <hr style="border-color:rgba(255,255,255,0.05); margin:16px 0">
      <h3 style="margin-bottom:12px; font-size:1rem">已爬取頁面</h3>
      <div id="pageList" class="page-list">
        <div class="empty-state">尚無頁面</div>
      </div>
    </div>
  </div>

  <!-- Page Detail Panel -->
  <div class="overlay" id="overlay" onclick="closeDetail()"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <h3 id="pageDetailTitle">頁面詳情</h3>
      <button class="btn btn-outline btn-sm" onclick="closeDetail()">關閉</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('markdown', this)">Markdown</button>
      <button class="tab" onclick="switchTab('html', this)">HTML</button>
    </div>
    <div class="detail-content">
      <pre id="pageDetailContent"></pre>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let currentJobId = null;
    let pollInterval = null;

    async function api(path, options = {}) {
      const res = await fetch(`/api${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      return res.json();
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function checkConfig() {
      const data = await api('/config');
      const status = document.getElementById('apiKeyStatus');
      if (data.api_key_set) {
        status.innerHTML = `<span style="color:var(--success)">已設定 (${data.api_key_preview})</span>`;
      } else {
        status.innerHTML = `<span style="color:var(--warning)">尚未設定 API Key</span>`;
      }
    }

    async function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return showToast('請輸入 API Key', 'error');
      const data = await api('/config', {
        method: 'POST',
        body: JSON.stringify({ api_key: key }),
      });
      if (data.error) return showToast(data.error, 'error');
      showToast('API Key 已儲存');
      document.getElementById('apiKeyInput').value = '';
      checkConfig();
    }

    async function startCrawl() {
      const url = document.getElementById('crawlUrl').value.trim();
      const limit = parseInt(document.getElementById('crawlLimit').value) || 100;
      if (!url) return showToast('請輸入網址', 'error');

      const btn = document.getElementById('startCrawlBtn');
      btn.disabled = true;
      btn.textContent = '啟動中...';

      try {
        const data = await api('/crawl', {
          method: 'POST',
          body: JSON.stringify({ url, limit, formats: ['markdown', 'html'] }),
        });
        if (data.error) {
          showToast(data.error, 'error');
          return;
        }
        showToast(`任務已建立: ${data.job_id}`);
        currentJobId = data.job_id;
        loadJobs();
        startPolling(data.job_id);
      } catch (e) {
        showToast('啟動失敗: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '開始爬取';
      }
    }

    async function loadJobs() {
      const data = await api('/jobs');
      const list = document.getElementById('jobList');

      if (!data.jobs || data.jobs.length === 0) {
        list.innerHTML = '<div class="empty-state">尚無任務</div>';
        return;
      }

      list.innerHTML = data.jobs.map(j => `
        <div class="job-item ${j.job_id === currentJobId ? 'active' : ''}" onclick="selectJob('${j.job_id}')">
          <div class="job-item-header">
            <span class="job-item-url">${escapeHtml(j.url)}</span>
            <span class="status-badge status-${j.status}">${j.status}</span>
          </div>
          <div class="job-item-meta">
            <span>ID: ${j.job_id}</span>
            <span>頁數: ${j.page_count}</span>
            <span>進度: ${j.completed}/${j.total || '?'}</span>
            <span>${formatTime(j.created_at)}</span>
          </div>
        </div>
      `).join('');
    }

    async function selectJob(jobId) {
      currentJobId = jobId;
      document.getElementById('jobDetail').style.display = '';
      loadJobDetail(jobId);
      loadJobs();
      startPolling(jobId);
    }

    async function loadJobDetail(jobId) {
      const data = await api(`/crawl/${jobId}`);
      if (data.error) return;

      document.getElementById('detailJobId').textContent = jobId;
      document.getElementById('detailUrl').textContent = data.url;
      document.getElementById('detailStatus').innerHTML =
        `<span class="status-badge status-${data.status}">${data.status}</span>`;
      document.getElementById('detailProgress').textContent =
        `${data.completed}/${data.total || '?'}`;
      document.getElementById('detailPageCount').textContent = data.page_count;

      const pct = data.total > 0 ? Math.round((data.completed / data.total) * 100) : 0;
      document.getElementById('detailProgressBar').style.width = pct + '%';

      const errEl = document.getElementById('detailError');
      if (data.error) {
        errEl.style.display = '';
        errEl.textContent = data.error;
      } else {
        errEl.style.display = 'none';
      }

      const resumeBtn = document.getElementById('resumeBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      resumeBtn.style.display = ['failed', 'cancelled'].includes(data.status) ? '' : 'none';
      cancelBtn.style.display = ['starting', 'crawling', 'scraping'].includes(data.status) ? '' : 'none';

      loadPages(jobId);
    }

    async function loadPages(jobId) {
      const data = await api(`/crawl/${jobId}/pages?per_page=200`);
      const list = document.getElementById('pageList');

      if (!data.pages || data.pages.length === 0) {
        list.innerHTML = '<div class="empty-state">尚無頁面</div>';
        return;
      }

      list.innerHTML = data.pages.map((p, i) => `
        <div class="page-item" onclick="showPageDetail('${jobId}', ${i})">
          <div class="page-item-title">${escapeHtml(p.title || '(無標題)')}</div>
          <div class="page-item-url">${escapeHtml(p.url)}</div>
        </div>
      `).join('');
    }

    async function showPageDetail(jobId, idx) {
      const data = await api(`/crawl/${jobId}/page/${idx}`);
      if (data.error) return showToast(data.error, 'error');

      document.getElementById('pageDetailTitle').textContent = data.title || data.url;
      document.getElementById('pageDetailContent').textContent = data.markdown || '(無內容)';
      document.getElementById('overlay').classList.add('open');
      document.getElementById('detailPanel').classList.add('open');

      window._currentPageData = data;
    }

    function switchTab(type, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const data = window._currentPageData;
      if (!data) return;
      document.getElementById('pageDetailContent').textContent =
        type === 'html' ? (data.html || '(無內容)') : (data.markdown || '(無內容)');
    }

    function closeDetail() {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('detailPanel').classList.remove('open');
    }

    async function resumeJob() {
      if (!currentJobId) return;
      const data = await api(`/crawl/${currentJobId}/resume`, { method: 'POST' });
      if (data.error) return showToast(data.error, 'error');
      showToast(`已從 ${data.existing_pages} 頁續傳，新任務: ${data.job_id}`);
      currentJobId = data.job_id;
      loadJobs();
      startPolling(data.job_id);
    }

    async function cancelJob() {
      if (!currentJobId) return;
      const data = await api(`/crawl/${currentJobId}/cancel`, { method: 'POST' });
      if (data.error) return showToast(data.error, 'error');
      showToast('任務已取消');
      loadJobDetail(currentJobId);
      loadJobs();
    }

    async function exportJob() {
      if (!currentJobId) return;
      const res = await fetch(`/api/crawl/${currentJobId}/export`);
      const data = await res.json();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `crawl-${currentJobId}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已匯出');
    }

    function startPolling(jobId) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (currentJobId !== jobId) return;
        await loadJobDetail(jobId);
        const data = await api(`/crawl/${jobId}`);
        if (['completed', 'failed', 'cancelled'].includes(data.status)) {
          clearInterval(pollInterval);
          pollInterval = null;
          loadJobs();
        }
      }, 3000);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString('zh-TW');
    }

    checkConfig();
    loadJobs();
  </script>
</body>
</html>
